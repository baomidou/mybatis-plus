name: Publish package to the Maven Central Repository
on:
  push:
    tags:
      - v*
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build without tests
        run: ./gradlew build -x test

      - name: Decode
        run: |
          mkdir -p ~/.gradle
          printf '%s' "$SIGNING_SECRET_KEY_RING_FILE" | base64 -d > ~/.gradle/secring.gpg
        env:
          SIGNING_SECRET_KEY_RING_FILE: ${{ secrets.SIGNING_SECRET_KEY_RING_FILE }}

      - name: Publish
        run: |
          AUTH_TOKEN=$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH_TOKEN"
          ./gradlew publishMavenJavaPublicationToLocalRepository publishToMavenCentralPortal \
            -x test \
            -DauthToken="$AUTH_TOKEN" \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.secretKeyRingFile="$HOME/.gradle/secring.gpg"
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
