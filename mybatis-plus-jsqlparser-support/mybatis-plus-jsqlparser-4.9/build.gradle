dependencies {
    api "com.github.jsqlparser:jsqlparser:4.9"
}

compileJava.dependsOn(processResources)

// 各版本独立编译共享源码和测试，保留各自的 JSqlParser 依赖
sourceSets {
    main {
        java {
            srcDir "${project(':mybatis-plus-jsqlparser-support').projectDir}/src/main-shared/java"
        }
    }
    test {
        java {
            srcDir "${project(':mybatis-plus-jsqlparser-support').projectDir}/src/test-shared/java"
        }
    }
}

// FST inspects JDK fields reflectively when FstFactory is constructed.
test {
    doFirst {
        if (javaLauncher.get().metadata.languageVersion.asInt() >= 9) {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.math=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.sql/java.sql=ALL-UNNAMED'
        }
    }
}
