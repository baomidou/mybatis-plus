dependencies {
    api project(":mybatis-plus")
    api "org.mybatis:mybatis-spring:${mybatisSpringVersion}"
    api project(":spring-boot-starter:mybatis-plus-spring-boot-autoconfigure")
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor:${springBootVersion}"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:${springBootVersion}"
    api "org.springframework.boot:spring-boot-autoconfigure"
    api "org.springframework.boot:spring-boot-starter-jdbc"
    implementation "org.springframework.boot:spring-boot-configuration-processor"
    implementation "org.springframework.boot:spring-boot-autoconfigure-processor"
    implementation "${lib['mybatis-thymeleaf']}"
    implementation "${lib.'mybatis-velocity'}"
    implementation "${lib.'mybatis-freemarker'}"
    implementation "${lib.'spring-cloud-commons'}"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "${lib.h2}"
}

compileJava.dependsOn(processResources)

// 引入共享测试源：autoconfigure 的 starter 共用测试 + core 的 pom 解析夹具 GeneratedPom
sourceSets {
    test {
        java {
            srcDir "${project(':spring-boot-starter:mybatis-plus-spring-boot-autoconfigure').projectDir}/src/test-shared/java"
            srcDir "${project(':mybatis-plus-core').projectDir}/src/test-shared/java"
        }
    }
}
